name: Engineering AI CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Test and build on Ubuntu
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: engineering-ai-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        run: .venv/bin/python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Verify Compose and build containers
        run: |
          docker compose config --quiet
          docker compose build
      - name: Container integration smoke test
        shell: bash
        run: |
          trap 'docker compose -f compose.yaml -f tests/compose.ci.yaml down --volumes' EXIT
          docker compose -f compose.yaml -f tests/compose.ci.yaml up -d --wait
          docker compose -f compose.yaml -f tests/compose.ci.yaml exec -T backend python - < tests/smoke.py
