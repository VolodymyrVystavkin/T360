
name: Engineering AI CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular and FastAPI
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Verify Docker installation
      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Docker installation..."
          docker --version

          echo "Checking Docker Compose..."
          docker compose version

          echo "Checking Docker Engine..."
          docker info > /dev/null

      # Step 3: Validate Docker Compose
      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          echo "Docker Compose configuration is valid."

      # Step 4: Build Docker images
      - name: Build Docker images
        run: |
          echo "Building Angular and FastAPI images..."
          docker compose build

      # Step 5: Verify images
      - name: Verify Docker images
        run: |
          echo "Checking built images..."
          docker compose images

      # Step 6: Complete CI build
      - name: Build completed
        run: |
          echo "Engineering AI Docker build completed successfully."
