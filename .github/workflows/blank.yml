
name: Engineering AI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Check Self-Hosted Runner
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "Checking self-hosted runner..."
          echo "Runner: $RUNNER_NAME"
          echo "Operating system: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Check installed tools
        shell: bash
        run: |
          echo "Checking Git..."
          git --version

          echo "Checking Python..."
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
          else
            echo "Python is not installed"
          fi

          echo "Checking Node.js..."
          if command -v node >/dev/null 2>&1; then
            node --version
          else
            echo "Node.js is not installed"
          fi

          echo "Checking npm..."
          if command -v npm >/dev/null 2>&1; then
            npm --version
          else
            echo "npm is not installed"
          fi

          echo "Checking Docker..."
          if command -v docker >/dev/null 2>&1; then
            docker --version
           else
            echo "Docker is not installed. Installing..."

            sudo apt-get update
            sudo apt-get install -y \
              ca-certificates \
              curl

            sudo install -m 0755 -d /etc/apt/keyrings

            sudo curl -fsSL \
              https://download.docker.com/linux/ubuntu/gpg \
              -o /etc/apt/keyrings/docker.asc

            sudo chmod a+r /etc/apt/keyrings/docker.asc

            . /etc/os-release

            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
              | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            sudo apt-get update

            sudo apt-get install -y \
              docker-ce \
              docker-ce-cli \
              containerd.io \
              docker-buildx-plugin \
              docker-compose-plugin

            echo "Docker installation completed."
          fi
          
      - name: Verify repository structure
        shell: bash
        run: |
          echo "Repository files:"
          ls -la

          if [ -d backend ]; then
            echo "FastAPI backend directory found"
          else
            echo "Backend directory not created yet"
          fi

          if [ -d frontend ]; then
            echo "Angular frontend directory found"
          else
            echo "Frontend directory not created yet"
          fi

      - name: Finish runner check
        run: echo "Self-hosted runner verification completed."
